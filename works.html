<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Artisan trail · Works</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="app-screen">
        <!-- Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span>
        </div>

        <!-- Header -->
        <div class="app-header">
            <div class="header-left">
                <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
                <h1>Works</h1>
            </div>
            <a href="profile.html" class="avatar-icon">
                <i class="fa-regular fa-user"></i>
            </a>
        </div>

        <!-- Scrollable Content -->
        <div class="page-container">

            <div class="section-head">Artworks Collection</div>

            <!-- Filters -->
            <div class="journey-tabs">
                <span class="pill active" data-filter="all" data-target="studio-card">All</span>
                <span class="pill" data-filter="stone" data-target="studio-card">Stone</span>
                <span class="pill" data-filter="thanka" data-target="studio-card">Thanka</span>
                <span class="pill" data-filter="metal" data-target="studio-card">Metal</span>
            </div>

            <!-- Grid -->
            <div class="studio-gallery" data-container="studio-card">

                <div class="studio-card" data-category="stone">
                    <i class="fa-solid fa-dharmachakra"></i>
                    <strong>Buddha Head</strong>
                    <span>Black Stone · 2024</span>
                </div>

                <div class="studio-card" data-category="thanka">
                    <i class="fa-solid fa-palette"></i>
                    <strong>Green Tara</strong>
                    <span>Mineral Pigments</span>
                </div>

                <div class="studio-card" data-category="metal">
                    <i class="fa-solid fa-hammer"></i>
                    <strong>Ritual Tray</strong>
                    <span>Hand-carved Brass</span>
                </div>

            </div>
        </div>


        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <i class="fa-regular fa-compass"></i>
                <span>Discover</span>
            </a>

            <a href="journeys.html" class="nav-item">
                <i class="fa-regular fa-map"></i>
                <span>Journeys</span>
            </a>

            <a href="works.html" class="nav-item">
                <i class="fa-regular fa-image"></i>
                <span>Works</span>
            </a>

            <a href="profile.html" class="nav-item">
                <i class="fa-regular fa-user"></i>
                <span>Profile</span>
            </a>
        </div>
    </div>
    <script>
    // Generic filter script
    document.addEventListener('DOMContentLoaded', function() {
        const filterPills = document.querySelectorAll('.pill');

        filterPills.forEach(pill => {
            pill.addEventListener('click', function() {
                // Remove active class from sibling pills targeting the same container
                const targetClass = this.getAttribute('data-target');
                document.querySelectorAll(`.pill[data-target="${targetClass}"]`).forEach(p => p.classList.remove('active'));

                this.classList.add('active');

                const filterValue = this.getAttribute('data-filter');
                const container = document.querySelector(`[data-container="${targetClass}"]`);
                if (!container) return;

                const cards = container.querySelectorAll(`.${targetClass}`);
                cards.forEach(card => {
                    if (filterValue === 'all' || card.getAttribute('data-category') === filterValue) {
                        card.classList.remove('hidden');
                    } else {
                        card.classList.add('hidden');
                    }
                });

                // Optional: show "no results"
                const visibleCards = container.querySelectorAll(`.${targetClass}:not(.hidden)`);
                const existingMsg = container.querySelector('#noResultsMsg');
                if (existingMsg) existingMsg.remove();

                if (visibleCards.length === 0) {
                    const noResults = document.createElement('div');
                    noResults.id = 'noResultsMsg';
                    noResults.style.cssText = 'text-align:center;padding:40px 20px;color:#9b8a7c;';
                    noResults.innerHTML = '<i class="fa-regular fa-face-frown" style="font-size:48px;margin-bottom:16px;"></i><p>No items found</p>';
                    container.appendChild(noResults);
                }
            });
        });

        // Initialize all containers with their "all" pills active
        filterPills.forEach(pill => {
            if (pill.classList.contains('active')) pill.click();
        });
    });
    </script>



    <script>
    document.querySelectorAll('a[href]').forEach(link => {
        const url = link.getAttribute('href');

        // Ignore external links
        if (url.startsWith('http') || url.startsWith('#')) return;

        link.addEventListener('click', e => {
            e.preventDefault();

            const container = document.querySelector('.page-container');
            if (!container) {
                window.location.href = url;
                return;
            }

            container.classList.add('page-exit');

            setTimeout(() => {
                window.location.href = url;
            }, 220);
        });
    });
    </script>

    <script>
    const isBack = performance.navigation.type === 2;

    const container = document.querySelector('.page-container');
    if (container) {
        container.classList.add(isBack ? 'page-back' : 'page-forward');
    }
    </script>


</body>

</html>
