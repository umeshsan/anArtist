<script>
const tabs = document.querySelectorAll('.journey-tabs .pill');
const cards = document.querySelectorAll('.studio-card');

tabs.forEach(tab => {
    tab.addEventListener('click', () => {
        
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        const artist = tab.getAttribute('data-artist');

        
        cards.forEach(card => {
            if (card.getAttribute('data-artist') === artist) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    });
});


cards.forEach(card => {
    if (!card.classList.contains('studio-card')) return;
    card.style.display = card.getAttribute('data-artist') === 'artist-amar' ? 'block' : 'none';
});
</script>
