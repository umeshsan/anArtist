<footer class="text-center">

        <a href="{{ "/" | relLangURL }}" class="nav-item {{ if .IsHome }}active{{ end }}">
            <i class="fa-solid fa-home"></i>
            <span>Home</span>
        </a>

        <!-- Discover -->
        <a href="{{ "/discover/" | relLangURL }}" class="nav-item {{ if in .RelPermalink "/discover/" }}active{{ end }}">
            <i class="fa-regular fa-compass"></i>

        <!-- Works -->
        <a href="{{ "/works/" | relLangURL }}" class="nav-item {{ if in .RelPermalink "/works/" }}active{{ end }}">

        </a>

        <!-- Journeys -->
        <a href="{{ "/journeys/" | relLangURL }}" class="nav-item {{ if in .RelPermalink "/journeys/" }}active{{ end }}">

        </a>
    </div>
</footer>
