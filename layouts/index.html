{{ define "main" }}
<!-- Scrollable Content -->
<div class="page-container" style="padding: 0; margin-bottom: 0;">
    <section class="hero-section">
        <!-- Background Image -->
        <div class="hero-bg"></div>

        <!-- Overlay -->
        <div class="hero-overlay"></div>

        <div class="hero">
            <div class="hero-content">
                <div class="hero-logo">
                    <img src="{{ (.Params.image | default "/img/logo.png") | relURL }}" alt="{{ .Title }}">
                </div>
                <h1>Hands That Shape History</h1>
                <p class="hero-subtitle">
                    Discover Master Artists in Metal, Stone & Thanka
                </p>
            </div>

            <div class="hero-buttons">
                <a href="{{ "/discover/" | relLangURL }}" class="btn-primary">
                    Explore Artists
                </a>
            </div>
        </div>
    </section>
</div>

{{ end }}
