{{ define "main" }}
<section class="hero-section">
    <!-- Background Image -->
    <div class="hero-bg"></div>

    <!-- Overlay -->
    <div class="hero-overlay"></div>

    <div class="hero">
        <div class="hero-content">
            <h1>Forged in Metal. Carved in Stone.</h1>
            <p class="hero-subtitle">
                Discover Master Artists in Metal, Stone & Engraving
            </p>
        </div>

        <div class="hero-buttons">
            <a href="{{ "/discover/" | relLangURL }}" class="btn-primary">
                Explore Artists
            </a>
        </div>
    </div>

    <!-- Scroll Down Animation -->
    <div class="scroll-indicator">
        <span></span>
    </div>
</section>

{{ end }}
